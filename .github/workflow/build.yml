name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Get version info
        id: version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="build.$COMMIT_COUNT"
          TAG="v$PROJECT_VERSION-$BUILD_NUMBER"
          echo "project_version=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH"         >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT"       >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER"       >> $GITHUB_OUTPUT
          echo "tag=$TAG"                         >> $GITHUB_OUTPUT

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.project_version }} (${{ steps.version.outputs.build_number }})"
          body: |
            ## SalwyrrFix ${{ steps.version.outputs.project_version }}

            | Field         | Value |
            |---------------|-------|
            | Version       | `${{ steps.version.outputs.project_version }}` |
            | Build         | `${{ steps.version.outputs.build_number }}` |
            | Commit        | `${{ steps.version.outputs.commit_hash }}` |
            | Full SHA      | `${{ github.sha }}` |
            | Branch        | `${{ github.ref_name }}` |
            | Triggered by  | `${{ github.actor }}` |
          files: target/launcher.jar
          make_latest: true
