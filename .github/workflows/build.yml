name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Get version info
        id: version
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.${COMMIT_COUNT}"
          TAG="v${VERSION}+${COMMIT_HASH}"
          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.version }} (${{ steps.version.outputs.commit_hash }})"
          body: |
            ## Salwyrr Launcher JAR v${{ steps.version.outputs.version }}

            | Field        | Value |
            |--------------|-------|
            | Version      | `${{ steps.version.outputs.version }}` |
            | Build        | `${{ steps.version.outputs.commit_count }}` |
            | Commit       | `${{ steps.version.outputs.commit_hash }}` |
            | Full SHA     | `${{ github.sha }}` |
            | Branch       | `${{ github.ref_name }}` |
            | Triggered by | `${{ github.actor }}` |

            ## Installation

            1. Download `launcher.jar` from the Assets below
            2. Navigate to your Salwyrr Launcher installation folder
            3. Drop `launcher.jar` into:
            ```
            resources/libraries/java/
            ```
            4. Restart the Salwyrr Launcher
          files: target/launcher.jar
          make_latest: true